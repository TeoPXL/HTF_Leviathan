http:
  routers:
    # === Existing routers ===
    api-router:
      rule: "PathPrefix(`/api`)"
      service: api-service
      middlewares:
        - compress-strip
      entryPoints:
        - web

    frontend-router:
      rule: "PathPrefix(`/`)"
      service: frontend-service
      middlewares:
        - frontend-chain
      entryPoints:
        - web

    ping-router:
      rule: "Path(`/ping`)"
      service: ping-service
      middlewares:
        - compress
      entryPoints:
        - web

  middlewares:
    compress-strip:
      chain:
        middlewares:
          - strip-api-prefix
          - compress

    frontend-chain:
      chain:
        middlewares:
          - compress
          - static-assets-cache

    compress:
      compress: {}

    strip-api-prefix:
      stripPrefix:
        prefixes:
          - "/api"

    static-assets-cache:
      headers:
        customResponseHeaders:
          Cache-Control: "public, max-age=31536000, immutable"

  services:
    api-service:
      loadBalancer:
        servers:
          - url: "http://api-htf:3000"
        passHostHeader: true

    frontend-service:
      loadBalancer:
        servers:
          - url: "http://vue-htf:81"
        passHostHeader: true

    ping-service:
      loadBalancer:
        servers:
          - url: "http://traefik-htf:80"
        passHostHeader: true